<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Matrícula - FATEC</title>
</head>

<body>
    <h1>Formulário de Matrícula</h1>
    <form action="" method="post">

        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required minlength="5">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">
            <br><br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados Acadêmicos</legend>

            <label for="curso">Curso:</label>
            <select id="curso" name="curso">
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
                <option value="opcao3">Opção 3</option>
            </select>
            <br><br>

            <p>Período:</p>
            <input type="radio" id="manha" name="periodo" value="manha">
            <label for="manha">Manhã</label>

            <input type="radio" id="noite" name="periodo" value="noite">
            <label for="noite">Noite</label>
            <br><br>

            <input type="checkbox" id="programou" name="programou" value="sim">
            <label for="programou">Já programou antes?</label>
        </fieldset>

        <br>

        <label for="observacoes">Observações:</label><br>
        <textarea id="observacoes" name="observacoes" rows="4" cols="50"></textarea>

        <br><br>

        <button type="submit">Enviar Matrícula</button>

    </form>
</body>

</html>
