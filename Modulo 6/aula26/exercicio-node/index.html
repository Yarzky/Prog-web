<html lang="pt-br">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
body {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-colour: #f0f0f0;
}
        .container {
          background: white;
          padding: 2rem;
          border-radius: 8px;

        }

  <body>

      <div class="container" style="border: 5px solid {{COLOUR}};">

        <div id="file-content">
          <h3>Conteúdo do arquivo <code>texto.txt</code>:</h3>
          <p>Número Aleatório: <strong>{{NUMBER}}</strong></p>
          <p>Cor Aleatória: <span style="colour: {{COLOUR}}; font-weight: bold;">{{COLOUR}}</span></p>
        </div>
      </div>
