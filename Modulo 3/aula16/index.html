<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Exercicio Pokédex</h1>
    <form action="" id="pokedex" method="get">
      <label for="name">Nome ou Numero</label>
      <input type="text" name="name" id="name" placeholder="Ex: pikachu ou 25" required>
      <button type="submit">Buscar</button>
    </form>
    <div id="status"></div>
    <div id="card"></div>
  </main>
  <script src="script.js"></script>
</body>

</html>
